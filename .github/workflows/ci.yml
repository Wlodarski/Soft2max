name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Code Linter & Type Check
      run: npx tsc --noEmit

    - name: Build Library (Compile TS to JS)
      run: npm run build # Étape cruciale : génère dist/ avant de lancer Jest et le Benchmark

    - name: Run Unit & Security Tests
      run: npm test

    - name: Run Performance Benchmark
      run: npm run benchmark
